<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Ground line -->
  <path d="M20,865 Q330,825 650,862" fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>

  <!-- Base mound -->
  <path d="M225,822 Q330,758 435,822 Z" fill="white"/>

  <!-- Pole -->
  <polygon points="300,652 362,652 388,822 274,822" fill="white"/>

  <!-- Pivot ball -->
  <circle cx="330" cy="652" r="36" fill="white"/>

  <!-- Strut from pivot to dish back -->
  <line x1="330" y1="652" x2="480" y2="560" stroke="white" stroke-width="26" stroke-linecap="round"/>

  <!-- Dish + feed support (rotated together) -->
  <g transform="rotate(-25 480 560)">
    <path fill-rule="evenodd" fill="white"
      d="M220,560 A260,100 0 1,0 740,560 A260,100 0 1,0 220,560 Z
