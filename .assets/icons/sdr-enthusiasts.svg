    <line x1="480" y1="340" x2="295" y2="545" stroke="white" stroke-width="14" stroke-linecap="round"/>
    <line x1="480" y1="340" x2="705" y2="545" stroke="white" stroke-width="14" stroke-linecap="round"/>
    <line x1="480" y1="340" x2="500" y2="600" stroke="white" stroke-width="14" stroke-linecap="round"/>
    <circle cx="480" cy="340" r="22" fill="white"/>
  </g>

  <!-- Signal / motion lines -->
  <g fill="none" stroke="white" stroke-width="14" stroke-linecap="round">
    <line x1="489" y1="368" x2="684" y2="90" stroke-dasharray="50 22 85 30"/>
    <line x1="555" y1="414" x2="749" y2="136" stroke-dasharray="65 18 60 35"/>
    <line x1="620" y1="460" x2="815" y2="182" stroke-dasharray="80 16 75 20"/>
    <line x1="686" y1="506" x2="880" y2="227" stroke-dasharray="58 26 68 24"/>
    <line x1="751" y1="552" x2="946" y2="273" stroke-dasharray="42 20 90 32"/>
  </g>

  <!-- Small distant plane -->
  <path fill="white" transform="translate(860,432) rotate(40) scale(8) translate(-11.5,-12)"
    d="M21,16V14L13,9V3.5C13,2.67 12.33,2 11.5,2C10.67,2 10,2.67 10,3.5V9L2,14V16L10,13.5V19L7.5,20.5V22L11.5,21L15.5,22V20.5L13,19V13.5L21,16Z"/>

  <!-- Main plane -->
  <path fill="white" transform="translate(780,230) rotate(55) scale(16) translate(-11.5,-12)"
    d="M21,16V14L13,9V3.5C13,2.67 12.33,2 11.5,2C10.67,2 10,2.67 10,3.5V9L2,14V16L10,13.5V19L7.5,20.5V22L11.5,21L15.5,22V20.5L13,19V13.5L21,16Z"/>
