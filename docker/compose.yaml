      - "traefik.http.routers.convert.entrypoints=websecure"
      - "traefik.http.services.convert.loadbalancer.server.port=1349"
      - "uptime.enable=true"
      - "uptime.address=https://convert.${DOMAIN}"
    <<: [ *restart-log, *traefik-data, *postgres ]
    profiles: [ prod ]

  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    volumes:
      - ./syncthing:/config
      - /mnt/sata/Media:/config/Media
    ports:
      - '${HOST_IP}:21027:21027/udp'
      - '${HOST_IP}:22000:22000/tcp'
      - '${HOST_IP}:22000:22000/udp'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.server.rule=Host(`server.${DOMAIN}`)"
      - "traefik.http.routers.server.entrypoints=websecure"
      - "traefik.http.services.server.loadbalancer.server.port=8384"
      - "uptime.enable=true"
      - "uptime.address=https://server.${DOMAIN}"
