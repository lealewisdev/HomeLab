x-common: &common
  env_file: ./common.env

x-data: &data
  networks: [ data ]
x-gluetun: &gluetun
  depends_on:
    gluetun:
      condition: service_healthy
  network_mode: service:gluetun

x-mariadb: &mariadb
  depends_on:
    mariadb:
      condition: service_healthy

x-postgres: &postgres
  depends_on:
    postgres:
      condition: service_healthy
  env_file: ./postgres.env

x-privileged-host: &privileged-host
  network_mode: host
  privileged: true

x-restart-log: &restart-log
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

x-traefik: &traefik
  networks: [ traefik ]

x-traefik-data: &traefik-data
  networks: [ traefik, data ]

name: homelab

services:
  actual:
    image: docker.io/actualbudget/actual-server:latest
    container_name: actual
    volumes:
      - ./actual:/data
    healthcheck:
      test: [ "CMD-SHELL", "node src/scripts/health-check.js" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.actual.rule=Host(`actual.${DOMAIN}`)"
      - "traefik.http.routers.actual.entrypoints=websecure"
      - "traefik.http.services.actual.loadbalancer.server.port=5006"
      - "uptime.enable=true"
      - "uptime.address=https://actual.${DOMAIN}"
      - "glance.category=Productivity"
    <<: [ *common, *restart-log, *traefik ]
    profiles: [ prod ]

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /proc:/host/proc:ro
    ports:
      - '127.0.0.1:12345:12345'
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alloy.rule=Host(`alloy.${DOMAIN}`)"
      - "traefik.http.routers.alloy.entrypoints=websecure"
      - "traefik.http.services.alloy.loadbalancer.server.port=12345"
      - "uptime.enable=true"
      - "uptime.address=https://alloy.${DOMAIN}"
      - "glance.category=DevOps"
    <<: [ *common, *restart-log, *traefik ]
    hostname: server
    privileged: true
    profiles: [ prod ]

  anki:
    image: afrima/anki-sync-server:latest
    container_name: anki
    volumes:
      - ./anki:/anki_data
    environment:
      SYNC_USER1: ${ANKI_USER1}:${ANKI_PASS1}
      SYNC_USER2: ${ANKI_USER2}:${ANKI_PASS2}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.anki.rule=Host(`anki.${DOMAIN}`)"
      - "traefik.http.routers.anki.entrypoints=websecure"
      - "traefik.http.services.anki.loadbalancer.server.port=8080"
      #      - "uptime.enable=true"
      #      - "uptime.address=https://anki.${DOMAIN}"
      - "glance.category=Productivity"
    <<: [ *common, *restart-log, *traefik ]
    profiles: [ prod ]

  apprise:
    image: caronc/apprise:latest
    container_name: apprise
    volumes:
      - ./apprise/config:/config
      - ./apprise/plugin:/plugin
      - ./apprise/attach:/attach
    environment:
      APPRISE_STATEFUL_MODE: simple
      APPRISE_WORKER_COUNT: "1"
      APPRISE_ADMIN: "y"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apprise.rule=Host(`apprise.${DOMAIN}`)"
      - "traefik.http.routers.apprise.entrypoints=websecure"
      - "traefik.http.services.apprise.loadbalancer.server.port=8000"
      - "uptime.enable=true"
      - "uptime.address=https://apprise.${DOMAIN}"
      - "glance.category=DevOps"
    <<: [ *common, *restart-log, *traefik ]
    profiles: [ prod ]

  atuin:
    image: ghcr.io/atuinsh/atuin:latest
    container_name: atuin
    volumes:
      - ./atuin:/config
    environment:
      ATUIN_HOST: "0.0.0.0"
      ATUIN_OPEN_REGISTRATION: "true"
      RUST_LOG: info,atuin_server=debug
    command: start
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.atuin.rule=Host(`atuin.${DOMAIN}`)"
      - "traefik.http.routers.atuin.entrypoints=websecure"
      - "traefik.http.services.atuin.loadbalancer.server.port=8888"
      - "uptime.enable=true"
      - "uptime.address=https://atuin.${DOMAIN}"
      - "glance.category=DevOps"
    <<: [ *restart-log, *traefik-data, *postgres ]
    profiles: [ prod ]

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    volumes:
      - /mnt/sata/Media/Audiobooks:/audiobooks
      - /mnt/sata/Media/Podcasts:/podcasts
      - ./audiobookshelf/metadata:/metadata
      - ./audiobookshelf/config:/config
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audio.rule=Host(`audio.${DOMAIN}`)"
      - "traefik.http.routers.audio.entrypoints=websecure"
      - "traefik.http.services.audio.loadbalancer.server.port=80"
      - "uptime.enable=true"
      - "uptime.address=https://audio.${DOMAIN}"
      - "glance.category=Media"
    user: 1000:1000
    <<: [ *common, *restart-log, *traefik ]
    profiles: [ prod ]

  beets:
    image: lscr.io/linuxserver/beets:latest
    container_name: beets
    volumes:
      - ./beets/config:/config
      - /mnt/sata/Media/Music:/music
      - /mnt/sata/slskd/complete:/downloads
      - ./beets/run:/etc/s6-overlay/s6-rc.d/svc-beets/run:ro
    labels:
      - "glance.category=Media"
    <<: [ *common, *restart-log ]
    profiles: [ prod ]

  byparr:
    build:
      context: ./byparr
      dockerfile: Dockerfile
    container_name: byparr
    volumes:
      - ./byparr/keys/id_ed25519:/home/nonroot/.ssh/id_ed25519:ro
      - ./byparr/config:/home/nonroot/.ssh/config:ro
    labels:
      - "glance.category=Media"
    <<: [ *common, *restart-log, *gluetun ]
    profiles: [ prod ]

  cadvisor:
    image: ghcr.io/google/cadvisor:0.54.0
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=60s"
      - "--store_container_labels=true"
      - "--disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp,percpu"
      - "--whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project"
    labels:
      - "glance.category=DevOps"
    <<: [ *common, *restart-log, *traefik ]
    privileged: true
    profiles: [ prod ]

  calibre:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre
    volumes:
      - ./calibre:/config
      - /mnt/sata/calibre:/cwa-book-ingest
      - /mnt/sata/Media/Books:/calibre-library
    #      - ./calibre/config/calibre/plugins:/config/.config/calibre/plugins
    environment:
      HARDCOVER_TOKEN: ${HARDCOVER}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.books.rule=Host(`books.${DOMAIN}`)"
      - "traefik.http.routers.books.entrypoints=websecure"
      - "traefik.http.services.books.loadbalancer.server.port=8083"
      - "uptime.enable=true"
      - "uptime.address=https://books.${DOMAIN}"
      - "glance.category=Media"
    <<: [ *common, *restart-log, *traefik ]
    profiles: [ prod ]

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    volumes:
      - ./cloudbeaver:/opt/cloudbeaver/workspace
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cloudbeaver.rule=Host(`db.${DOMAIN}`)"
      - "traefik.http.routers.cloudbeaver.entrypoints=websecure"
      - "traefik.http.services.cloudbeaver.loadbalancer.server.port=8978"
      - "uptime.enable=true"
      - "uptime.address=https://db.${DOMAIN}"
      - "glance.category=DevOps"
    <<: [ *common, *restart-log, *traefik-data ]
    profiles: [ prod ]

  degoog:
    image: ghcr.io/degoog-org/degoog:latest
    container_name: degoog
    volumes:
      - ./degoog:/app/data
    environment:
      DEGOOG_PUBLIC_INSTANCE: "false"
      DEGOOG_VALKEY_URL: ${REDIS_URL}/5
      DEGOOG_DANGEROUSLY_NO_PASSWORD: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.degoog.rule=Host(`degoog.${DOMAIN}`)"
      - "traefik.http.routers.degoog.entrypoints=websecure"
      - "traefik.http.services.degoog.loadbalancer.server.port=4444"
      - "uptime.enable=true"
      - "uptime.address=https://degoog.${DOMAIN}"
      - "glance.category=Productivity"
    <<: [ *common, *restart-log, *traefik-data, *postgres ]
    profiles: [ prod ]

  esphome:
    image: ghcr.io/esphome/esphome:latest
    container_name: esphome
    volumes:
      - ./esphome/config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      ESPHOME_DASHBOARD_USE_PING: true
      USERNAME: ${ESP_USER}
      PASSWORD: ${ESP_PASSWORD}
    labels:
      - "uptime.enable=true"
      - "uptime.address=https://esp.${DOMAIN}"
      - "glance.category=IOT"
    <<: [ *common, *restart-log, *privileged-host ]
    profiles: [ prod ]

  freshrss:
    image: lscr.io/linuxserver/freshrss:latest
    container_name: freshrss
    volumes:
      - ./freshrss:/config
    environment:
      - POSTGRES_DB=freshrss
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rss.rule=Host(`rss.${DOMAIN}`)"
      - "traefik.http.routers.rss.entrypoints=websecure"
      - "traefik.http.services.rss.loadbalancer.server.port=80"
      - "uptime.enable=true"
      - "uptime.address=https://rss.${DOMAIN}"
      - "glance.category=Media"
    <<: [ *common, *restart-log, *traefik-data, *postgres ]
    profiles: [ prod ]

  git:
    image: codeberg.org/forgejo/forgejo:15
    container_name: git
    volumes:
      - ./git/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '${HOST_IP}:222:22/tcp'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.git.rule=Host(`git.${DOMAIN}`)"
      - "traefik.http.routers.git.entrypoints=websecure"
      - "traefik.http.services.git.loadbalancer.server.port=3000"
      - "uptime.enable=true"
      - "uptime.address=https://git.${DOMAIN}"
    <<: [ *restart-log, *traefik-data, *postgres ]
    profiles: [ prod ]

  git_runner:
    image: "data.forgejo.org/forgejo/runner:13"
    container_name: git_runner
    volumes:
      - ./git/runner/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '39080:39080'
      - '39081:39081'
    command: "forgejo-runner daemon --config runner-config.yml"
    labels:
      - "glance.category=DevOps"
    <<: [ *common, *restart-log, *traefik ]
    group_add:
      - 131
    profiles: [ prod ]

  glance:
    image: glanceapp/glance:latest
    container_name: glance
    volumes:
      - ./glance/config:/app/config
      - ./glance/assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glance.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.glance.entrypoints=websecure"
      - "traefik.http.services.glance.loadbalancer.server.port=8080"
      - "uptime.enable=true"
      - "uptime.address=https://${DOMAIN}"
    <<: [ *common, *restart-log, *traefik ]
    profiles: [ prod ]

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    volumes:
      - ./gluetun:/gluetun
    environment:
      HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: config.toml
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      WIREGUARD_ENDPOINT_IP: ${WIREGUARD_ENDPOINT_IP}
      WIREGUARD_ENDPOINT_PORT: ${WIREGUARD_ENDPOINT_PORT}
      WIREGUARD_PUBLIC_KEY: ${WIREGUARD_PUBLIC_KEY}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_PRESHARED_KEY: ${WIREGUARD_PRESHARED_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
    ports:
      - '${HOST_IP}:8388:8388/tcp' # gluetun shadowsocks
      - '${HOST_IP}:8388:8388/udp' # gluetun shadowsocks
      - '${HOST_IP}:8888:8888/tcp' # gluetun HTTP proxy
      - '${HOST_IP}:8191:8191/tcp' # byparr
    labels:
      - "glance.category=DevOps"
      - "traefik.enable=true"
      - "traefik.http.routers.gluetun.rule=Host(`gluetun.${DOMAIN}`)"
      - "traefik.http.routers.gluetun.service=gluetun"
      - "traefik.http.services.gluetun.loadbalancer.server.port=8000"
    <<: [ *common, *restart-log, *traefik-data ]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    profiles: [ prod ]

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: grafana
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "uptime.enable=true"
      - "uptime.address=https://grafana.${DOMAIN}"
      - "glance.category=DevOps"
    <<: [ *common, *restart-log, *traefik ]
    profiles: [ prod ]

  grist:
    image: gristlabs/grist:latest
    container_name: grist
    volumes:
      - ./grist:/persist
    environment:
      TYPEORM_DATABASE: grist
      REDIS_URL: ${REDIS_URL}/7
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grist.rule=Host(`sheets.${DOMAIN}`)"
      - "traefik.http.routers.grist.entrypoints=websecure"
      - "traefik.http.services.grist.loadbalancer.server.port=8484"
      - "uptime.enable=true"
      - "uptime.address=https://sheets.${DOMAIN}"
      - "glance.category=Productivity"
    <<: [ *restart-log, *traefik-data, *postgres ]
    profiles: [ prod ]

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:latest
    container_name: homeassistant
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    labels:
      - "uptime.enable=true"
      - "uptime.address=https://ha.${DOMAIN}"
      - "glance.category=IOT"
    <<: [ *common, *restart-log, *privileged-host ]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    profiles: [ prod ]

  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest
    container_name: homebox
    volumes:
      - ./homebox:/data/
    environment:
      HBOX_LOG_LEVEL: info
      HBOX_LOG_FORMAT: text
      HBOX_WEB_MAX_FILE_UPLOAD: 10
      HBOX_OPTIONS_ALLOW_ANALYTICS: false
      HBOX_AUTH_API_KEY_PEPPER: ${HBOX_AUTH_API_KEY_PEPPER}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homebox.rule=Host(`inventory.${DOMAIN}`)"
      - "traefik.http.routers.homebox.entrypoints=websecure"
      - "traefik.http.services.homebox.loadbalancer.server.port=7745"
      - "uptime.enable=true"
      - "uptime.address=https://inventory.${DOMAIN}"
      - "glance.category=Productivity"
    <<: [ *restart-log, *traefik-data, *postgres ]
    profiles: [ prod ]

  immich:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich
    volumes:
      - /mnt/sata/Media/Immich:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      REDIS_DBINDEX: 3
      DB_DATABASE_NAME: immich
    healthcheck:
      disable: false
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`immich.${DOMAIN}`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
      - "uptime.enable=true"
      - "uptime.address=https://immich.${DOMAIN}"
      - "glance.category=Media"
    <<: [ *restart-log, *traefik-data, *postgres ]
    profiles: [ prod ]

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    volumes:
      - ./jellyfin:/config
      - /mnt/sata/Media/Series:/data/tvshows
      - /mnt/sata/Media/Movies:/data/movies
      - /mnt/sata/Media/Anime:/data/anime
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "uptime.enable=true"
      - "uptime.address=https://jellyfin.${DOMAIN}"
      - "glance.category=Media"
    <<: [ *common, *restart-log, *traefik ]
    profiles: [ prod ]

  koito:
    image: gabehf/koito:latest
    container_name: koito
    volumes:
      - ./koito:/etc/koito
    environment:
      KOITO_SUBSONIC_URL: https://${NAVIDROME}.${DOMAIN}
      KOITO_SUBSONIC_PARAMS: u=${KOITO_USER}&t=${KOITO_SUBSONIC_PARAMS}&s=${NAVIDROME_SALT}
      KOITO_DEFAULT_THEME: catppuccin
      KOITO_DEFAULT_USERNAME: ${KOITO_USER}
      KOITO_DEFAULT_PASSWORD: ${KOITO_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${KOITO}.rule=Host(`${KOITO}.${DOMAIN}`)"
      - "traefik.http.routers.${KOITO}.entrypoints=websecure"
      - "traefik.http.services.${KOITO}.loadbalancer.server.port=4110"
      - "uptime.enable=true"
      - "uptime.address=https://${KOITO}.${DOMAIN}"
      - "glance.category=Media"
    <<: [ *common, *restart-log, *traefik ]
    profiles: [ prod ]

  komga:
    image: gotson/komga:latest
    container_name: komga
    volumes:
      - /mnt/sata/Media/Comics/:/data
      - ./komga:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.comics.rule=Host(`comics.${DOMAIN}`)"
      - "traefik.http.routers.comics.entrypoints=websecure"
      - "traefik.http.services.comics.loadbalancer.server.port=25600"
      - "uptime.enable=true"
      - "uptime.address=https://comics.${DOMAIN}"
      - "glance.category=Media"
    <<: [ *common, *restart-log, *traefik ]
    profiles: [ prod ]

  kopia:
    image: kopia/kopia:latest
    container_name: kopia
    volumes:
      - ./kopia/config:/app/config
      - ./kopia/cache:/app/cache
      - ./kopia/logs:/app/logs
      - ./z2m:/data:ro
      - /mnt/sata/Kopia:/repository
      - ./kopia/tmp:/tmp:shared
    environment:
      KOPIA_PASSWORD: ${KOPIA_PASSWORD}
      USER: ${KOPIA_USER}
    command:
      - server
      - start
      - --disable-csrf-token-checks
      - --insecure
      - --address=0.0.0.0:51515
      - --server-username=${KOPIA_USER}
      - --server-password=${KOPIA_PASSWORD}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kopia.rule=Host(`kopia.${DOMAIN}`)"
      - "traefik.http.routers.kopia.entrypoints=websecure"
      - "traefik.http.services.kopia.loadbalancer.server.port=51515"
      - "uptime.enable=true"
      - "uptime.address=https://kopia.${DOMAIN}"
      - "glance.category=Productivity"
    <<: [ *restart-log, *traefik ]
    hostname: kopia
    profiles: [ dev ]

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    container_name: linkwarden
    volumes:
      - ./linkwarden:/data/data
    environment:
      NEXTAUTH_URL: https://linkwarden.${DOMAIN}/api/v1/auth
      NEXTAUTH_SECRET: ${LINKWARDEN_SECRET}
      DATABASE_URL: ${PG_URL}/linkwarden
      MEILI_HOST: http://meili:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.linkwarden.rule=Host(`bookmarks.${DOMAIN}`)"
      - "traefik.http.routers.linkwarden.entrypoints=websecure"
      - "traefik.http.services.linkwarden.loadbalancer.server.port=3000"
      - "uptime.enable=true"
      - "uptime.address=https://bookmarks.${DOMAIN}"
      - "glance.category=Productivity"
    <<: [ *restart-log, *traefik-data, *postgres ]
    profiles: [ prod ]

