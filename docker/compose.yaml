      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless.rule=Host(`paperless.${DOMAIN}`)"
      - "traefik.http.routers.paperless.entrypoints=websecure"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
      - "uptime.enable=true"
      - "uptime.address=https://paperless.${DOMAIN}"
      - "glance.category=Media"
    <<: [ *restart-log, *traefik-data, *postgres ]
    profiles: [ prod ]

  pelican:
    image: ghcr.io/pelican/panel:latest
    container_name: pelican
    volumes:
      - ./pelican/data:/pelican-data
      - ./pelican/logs:/var/www/html/storage/logs
    environment:
      APP_DEBUG: "false"
      APP_ENV: "production"
      BEHIND_PROXY: true
      TRUSTED_PROXIES: ${TRAEFIK}
      APP_URL: "https://peli.${DOMAIN}"
      XDG_DATA_HOME: ./pelican/data
      CACHE_STORE: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
      REDIS_HOST: "redis"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.peli.rule=Host(`peli.${DOMAIN}`)"
      - "traefik.http.routers.peli.entrypoints=websecure"
      - "traefik.http.services.peli.loadbalancer.server.port=80"
      - "uptime.enable=true"
      - "uptime.address=https://peli.${DOMAIN}"
    <<: [ *common, *restart-log, *traefik-data, *postgres ]
    profiles: [ prod ]

  piper:
    image: lscr.io/linuxserver/piper:latest
    container_name: piper
    volumes:
      - ./piper:/config
    environment:
      PIPER_VOICE: en_US-lessac-medium
    ports:
      - '${HOST_IP}:10200:10200/tcp'
    labels:
      - "glance.category=IOT"
    <<: [ *common, *restart-log ]
    profiles: [ prod ]

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: postgres
    volumes:
      - ./postgres/data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${PG}
    command: postgres -c shared_preload_libraries='vchord.so'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER} -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "glance.category=DevOps"
    <<: [ *common, *restart-log, *data ]
    profiles: [ prod ]

  redis:
    image: docker.io/valkey/valkey:9-alpine
    container_name: redis
    volumes:
      - ./redis:/data
    command: [ "valkey-server", "--requirepass", "${REDIS_PASSWORD}" ]
    labels:
      - "glance.category=DevOps"
    <<: [ *common, *restart-log, *data ]
    profiles: [ prod ]

  sane:
    image: sbs20/scanservjs:latest
    container_name: sane
    volumes:
      - ./sane:/etc/scanservjs
      - /mnt/sata/sane:/var/lib/scanservjs/output
    environment:
      - SANED_NET_HOSTS=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sane.rule=Host(`scan.${DOMAIN}`)"
      - "traefik.http.routers.sane.entrypoints=websecure"
      - "traefik.http.services.sane.loadbalancer.server.port=8080"
      - "uptime.enable=true"
      - "uptime.address=https://scan.${DOMAIN}"
      - "glance.category=Productivity"
    <<: [ *common, *restart-log, *traefik ]
    profiles: [ prod ]

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    volumes:
      - ./seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`seerr.${DOMAIN}`)"
      - "traefik.http.routers.seerr.entrypoints=websecure"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
      - "uptime.enable=true"
      - "uptime.address=https://seerr.${DOMAIN}"
    <<: [ *common, *restart-log, *traefik ]
    init: true
    profiles: [ prod ]

  semaphore:
    build:
