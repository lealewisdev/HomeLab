      - /run/user/1000/pulse:/run/user/1000/pulse
      - ./sendspin:/config
    environment:
      SENDSPIN_SERVER: auto
      AUDIO_UID: 1000
      AUDIO_GID: 1000
      PULSE_SERVER: unix:/run/user/1000/pulse/native
      XDG_RUNTIME_DIR: /run/user/1000
      WEB_PORT: 8088
    labels:
      - "uptime.enable=true"
      - "uptime.address=https://sendspin.${DOMAIN}"
      - "glance.category=IOT"
    <<: [ *common, *restart-log, *privileged-host ]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    profiles: [ prod ]
    security_opt:
