      dockerfile: Dockerfile
    container_name: semaphore
    environment:
      SEMAPHORE_PLAYBOOK_PATH: /tmp/semaphore/
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD}
      SEMAPHORE_ADMIN_NAME: ${SEMAPHORE_ADMIN_NAME}
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_ADMIN_EMAIL}
      SEMAPHORE_ADMIN: ${SEMAPHORE_ADMIN_NAME}
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.semaphore.rule=Host(`semaphore.${DOMAIN}`)"
      - "traefik.http.routers.semaphore.entrypoints=websecure"
      - "traefik.http.services.semaphore.loadbalancer.server.port=3000"
      - "uptime.enable=true"
      - "uptime.address=https://semaphore.${DOMAIN}"
      - "glance.category=DevOps"
    <<: [ *restart-log, *traefik-data, *postgres ]
    profiles: [ prod ]

  sendspin:
    image: ghcr.io/trudenboy/sendspin-bt-bridge:latest
    container_name: sendspin
    volumes:
      - /var/run/dbus:/var/run/dbus
