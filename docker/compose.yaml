    profiles: [ prod ]

  onnx:
    image: ghcr.io/tboby/wyoming-onnx-asr:latest
    container_name: onnx
    volumes:
      - ./onxx:/data
    ports:
      - '${HOST_IP}:10300:10300/tcp'
    labels:
      - "glance.category=IOT"
    <<: [ *common, *restart-log ]
    profiles: [ prod ]

  otbr:
    image: openthread/border-router:sha-8146f98
    container_name: otbr
    volumes:
      - ./otbr:/data
      - /run/dbus:/run/dbus:ro
    environment:
      OT_RCP_DEVICE: "spinel+hdlc+uart:///dev/ttyUSB1?uart-baudrate=460800&uart-flow-control=1"
      OT_INFRA_IF: ${ETH}
      OT_THREAD_IF: wpan0
      OT_LOG_LEVEL: 7
      OT_WEB_LISTEN_PORT: 7586
      OT_REST_LISTEN_ADDR: 0.0.0.0
      OT_WEB_LISTEN_ADDR: 0.0.0.0
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:7586/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      - "uptime.enable=true"
      - "uptime.address=https://otbr.${DOMAIN}"
      - "glance.category=IOT"
    <<: [ *common, *restart-log, *privileged-host ]
    cap_add:
      - NET_ADMIN
    devices:
      - ${THREAD}:/dev/ttyUSB1
      - /dev/net/tun:/dev/net/tun
    profiles: [ prod ]

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    volumes:
      - ./paperless/data:/usr/src/paperless/data
      - ./paperless/media:/usr/src/paperless/media
      - ./paperless/export:/usr/src/paperless/export
      - ./paperless/consume:/usr/src/paperless/consume
