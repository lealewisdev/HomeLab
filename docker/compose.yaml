  ultrafeeder:
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder:telegraf
    container_name: ultrafeeder
    volumes:
      - ./ultrafeeder/globe_history:/var/globe_history
      - ./ultrafeeder/graphs1090:/var/lib/collectd
      - /proc/diskstats:/proc/diskstats:ro
      - /dev/bus/usb:/dev/bus/usb
    environment:
      LOGLEVEL: none
      READSB_DEVICE_TYPE: rtlsdr
      READSB_GAIN: auto
      READSB_RTLSDR_DEVICE: ${ADSB_SDR_SERIAL}
      READSB_RTLSDR_PPM: ${ADSB_SDR_PPM}
      READSB_LAT: ${FEEDER_LAT}
      READSB_LON: ${FEEDER_LONG}
      READSB_ALT: ${FEEDER_ALT_M}m
      READSB_RX_LOCATION_ACCURACY: 2
      READSB_STATS_RANGE: true
      ULTRAFEEDER_CONFIG: >
        adsb,feed.adsb.fi,30004,beast_reduce_plus_out,uuid=${MULTIFEEDER_UUID}; mlat,feed.adsb.fi,31090,39000,uuid=${MULTIFEEDER_UUID}; mlathub,localhost,30104,beast_in;
      UUID: ${MULTIFEEDER_UUID}
      MLAT_USER: ${FEEDER_NAME}
      READSB_FORWARD_MLAT_SBS: true
      UPDATE_TAR1090: true
      TAR1090_DEFAULTCENTERLAT: ${FEEDER_LAT}
      TAR1090_DEFAULTCENTERLON: ${FEEDER_LONG}
      TAR1090_MESSAGERATEINTITLE: true
      TAR1090_PAGETITLE: ${FEEDER_NAME}
      TAR1090_PLANECOUNTINTITLE: true
      TAR1090_ENABLE_AC_DB: true
      TAR1090_FLIGHTAWARELINKS: true
      HEYWHATSTHAT_PANORAMA_ID: ${FEEDER_HEYWHATSTHAT_ID}
      HEYWHATSTHAT_ALTS: ${FEEDER_HEYWHATSTHAT_ALTS}
      TAR1090_SITESHOW: true
      TAR1090_RANGE_OUTLINE_COLORED_BY_ALTITUDE: true
      TAR1090_RANGE_OUTLINE_WIDTH: 2.0
      TAR1090_RANGERINGSDISTANCES: 50,100,150,200
      TAR1090_RANGERINGSCOLORS: "#1A237E,#0D47A1,#42A5F5,#64B5F6"
      TAR1090_USEROUTEAPI: true
      GRAPHS1090_DARKMODE: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adsb.rule=Host(`adsb.${DOMAIN}`)"
      - "traefik.http.routers.adsb.entrypoints=websecure"
      - "traefik.http.services.adsb.loadbalancer.server.port=80"
      - "uptime.enable=true"
      - "uptime.address=https://adsb.${DOMAIN}"
      - "glance.category=Other"
    <<: [ *common, *restart-log, *traefik ]
    device_cgroup_rules:
      - "c 189:* rwm"
    hostname: ultrafeeder
    profiles: [ prod ]
    tmpfs:
      - /run:exec,size=256M
      - /tmp:size=128M
      - /var/log:size=32M

  umap:
    image: docker.io/umap/umap:3.6.1
    container_name: umap
    volumes:
      - ./umap/data:/srv/umap/uploads
      - ./umap/static:/srv/umap/static
    environment:
      STATIC_ROOT: /srv/umap/static
      MEDIA_ROOT: /srv/umap/uploads
      DATABASE_URL: ${PG_URL}/umap
      SECRET_KEY: ${UMAP_SECRET_KEY}
      SITE_URL: ${HOST_IP}:8004
      UMAP_ALLOW_ANONYMOUS: false
      DEBUG: 1
      REALTIME_ENABLED: 1
      REDIS_URL: ${REDIS_URL}/2
      UVICORN_PORT: 8004
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umap.rule=Host(`map.${DOMAIN}`)"
      - "traefik.http.routers.umap.entrypoints=websecure"
      - "traefik.http.services.umap.loadbalancer.server.port=8004"
      - "uptime.enable=true"
      - "uptime.address=https://map.${DOMAIN}"
      - "glance.category=Productivity"
    <<: [ *restart-log, *traefik-data, *postgres ]
    profiles: [ prod ]

  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: victorialogs
    volumes:
      - ./victoria/logs:/victoria-logs-data
    labels:
      - "glance.category=DevOps"
    <<: [ *common, *restart-log, *traefik ]
    profiles: [ prod ]

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    volumes:
      - ./victoria/metrics:/victoria-metrics-data
    command:
      - "-maxLabelsPerTimeseries=80"
    labels:
      - "glance.category=DevOps"
    <<: [ *common, *restart-log, *traefik ]
    profiles: [ prod ]

  vikunja:
    image: vikunja/vikunja:latest
    container_name: vikunja
    volumes:
      - ./vikunja:/app/vikunja/files
    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://todo.${DOMAIN}
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_SERVICE_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vikunja.rule=Host(`todo.${DOMAIN}`)"
      - "traefik.http.routers.vikunja.entrypoints=websecure"
      - "traefik.http.services.vikunja.loadbalancer.server.port=3456"
      - "uptime.enable=true"
      - "uptime.address=https://todo.${DOMAIN}"
      - "glance.category=Productivity"
    <<: [ *restart-log, *traefik-data, *postgres ]
    profiles: [ prod ]

  wings:
    image: ghcr.io/pelican/wings:latest
    container_name: wings
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers/:/var/lib/docker/containers/
      - /home/admin/wings/etc:/etc/pelican/
      - /home/admin/wings/lib:/home/admin/wings/lib
      - /home/admin/wings/log:/home/admin/wings/log
      - /home/admin/wings/tmp:/home/admin/wings/tmp
    environment:
      WINGS_UID: 988
      WINGS_GID: 988
      WINGS_USERNAME: pelican
    ports:
      - '${HOST_IP}:2022:2022/tcp'
      - '${HOST_IP}:8083:8080/tcp'
    networks:
      - wings0
    labels:
      - "glance.category=Other"
    <<: [ *common, *restart-log ]
    profiles: [ prod ]
    tty: true

  yamtrack:
    image: ghcr.io/fuzzygrim/yamtrack:latest
    container_name: yamtrack
    volumes:
      - ./yamtrack:/yamtrack/db
    environment:
      SECRET: ${YAMTRACK_SECRET}
      REDIS_URL: ${REDIS_URL}/6
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.yam.rule=Host(`yam.${DOMAIN}`)"
      - "traefik.http.routers.yam.entrypoints=websecure"
      - "traefik.http.services.yam.loadbalancer.server.port=8000"
      - "uptime.enable=true"
      - "uptime.address=https://yam.${DOMAIN}"
      - "glance.category=Ethical Acquisition"
    <<: [ *common, *restart-log, *traefik-data, *postgres ]
    profiles: [ prod ]

  z2m:
    image: ghcr.io/koenkk/zigbee2mqtt:latest
    container_name: z2m
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./z2m:/app/data
      - /run/udev:/run/udev:ro
    labels:
      - "uptime.enable=true"
      - "uptime.address=https://z2m.${DOMAIN}"
      - "glance.category=IOT"
    user: "1000:1000"
    <<: [ *common, *restart-log, *privileged-host ]
    devices:
      - ${ZIGBEE}:/dev/ttyUSB0
    group_add:
      - dialout
    profiles: [ prod ]

networks:
  gluetun:
    name: gluetun
    driver: bridge
  traefik:
    name: traefik
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.2.0/24
          ip_range: 172.31.2.128/25
  data:
    name: data
    driver: bridge
    internal: true
  wings0:
    name: wings0
    driver: bridge
    ipam:
      config:
        - subnet: "172.21.0.0/16"
    driver_opts:
      com.docker.network.bridge.name: wings0
