      - '${HOST_IP}:8080:80/tcp'
    networks:
      traefik:
        ipv4_address: 172.31.2.2
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$apr1$$${TRAEFIK_HASH}"
      - "traefik.http.routers.traefik.middlewares=dashboard-auth"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=porkbun"
      - "traefik.http.routers.traefik.service=api@internal"
      - "uptime.enable=true"
      - "uptime.address=https://traefik.${DOMAIN}"
      - "glance.category=DevOps"
