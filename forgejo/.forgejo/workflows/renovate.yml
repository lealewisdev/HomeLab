name: Renovate
on:
  schedule:
    - cron: "0 4 * * *"
      timezone: Europe/London
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renovate:
    runs-on: docker
    container: renovate/renovate:44.52@sha256:778ff1b404d79ef7763f0c904ebb279a4138ffc1017181ad076b1648e37f6dbd
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_PLATFORM: 'forgejo'
          RENOVATE_ENDPOINT: https://${{ vars.REGISTRY }}/api/v1
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.GH_TOKEN }}
          RENOVATE_GIT_AUTHOR: 'Renovate Bot <${{ secrets.RENOVATE_BOT_EMAIL }}>'
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_TIMEZONE: 'Europe/London'
          RENOVATE_DETECT_HOST_RULES_FROM_ENV: 'true'
          RENOVATE_DOCKER_DHI_IO_USERNAME: ${{ secrets.DHI_USER }}
          RENOVATE_DOCKER_DHI_IO_PASSWORD: ${{ secrets.DHI_TOKEN }}
          RENOVATE_DEB_DHI_IO_USERNAME: ${{ secrets.DHI_USER }}
          RENOVATE_DEB_DHI_IO_PASSWORD: ${{ secrets.DHI_TOKEN }}
          RENOVATE_DRY_RUN: lookup
          LOG_LEVEL: debug
        run: renovate

      - name: Notify n8n
        if: '!cancelled()'
        continue-on-error: true
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          APPRISE_URL: ${{ secrets.APPRISE_URL }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eo pipefail
          curl \
            --fail-with-body \
            --show-error \
            --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Token: ${N8N_WEBHOOK_TOKEN}" \
            -d "{\"repository\":\"${REPOSITORY}\",\"workflow\":\"${WORKFLOW}\",\"run_url\":\"${RUN_URL}\",\"status\":\"${JOB_STATUS}\",\"apprise_url\":\"${APPRISE_URL}\"}" \
            "$N8N_WEBHOOK_URL"
