name: Build, Scan, Push Image
on:
  workflow_call:
    inputs:
      dockerfile-context:
        required: true
        type: string
      image-tag-var:
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE: ${{ vars.REGISTRY }}/${{ github.repository }}
  CONTEXT: ${{ inputs.dockerfile-context }}
  TAG_VAR: ${{ inputs.image-tag-var }}
  REF_NAME: ${{ github.ref_name }}

jobs:
  build:
    runs-on: docker
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read Version
        id: version
        run: |
          VERSION_FILE="${CONTEXT}/VERSION"
          if [ ! -f "$VERSION_FILE" ]; then
            echo "Missing $VERSION_FILE" >&2
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < "$VERSION_FILE")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be plain semver (e.g. 1.4.0), got: $VERSION" >&2
            exit 1
          fi
          echo "full=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Guard Version Bump
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "No previous ref position to diff against, skipping guard."
            exit 0
          fi
          DOCKERFILE_CHANGED=$(git diff --name-only "$BEFORE" HEAD -- "${CONTEXT}/Dockerfile")
          VERSION_CHANGED=$(git diff --name-only "$BEFORE" HEAD -- "${CONTEXT}/VERSION")
          if [ -n "$DOCKERFILE_CHANGED" ] && [ -z "$VERSION_CHANGED" ]; then
            echo "Dockerfile in ${CONTEXT} changed but VERSION wasn't bumped." >&2
            echo "Bump ${CONTEXT}/VERSION before merging." >&2
            exit 1
          fi

      - name: Set Image Tags
        id: tags
        env:
          VERSION_FULL: ${{ steps.version.outputs.full }}
          VERSION_MAJOR_MINOR: ${{ steps.version.outputs.major_minor }}
          VERSION_MAJOR: ${{ steps.version.outputs.major }}
        run: |
          BASE="${IMAGE}:${TAG_VAR}"
          SHA="$(git rev-parse --short HEAD)"

          if [ "$REF_NAME" = "main" ]; then
            TAGS="${BASE}-latest,${BASE}-${SHA},${BASE}-${VERSION_FULL},${BASE}-${VERSION_MAJOR_MINOR},${BASE}-${VERSION_MAJOR}"
            PRIMARY="${BASE}-${SHA}"
          else
            BRANCH_SLUG=$(printf '%s' "$REF_NAME" \
              | tr '[:upper:]' '[:lower:]' \
              | tr -c 'a-z0-9._-' '-' \
              | sed -E 's/^[-.]+//' \
              | cut -c1-100)
            TAGS="${BASE}-${BRANCH_SLUG},${BASE}-${BRANCH_SLUG}-${SHA}"
            PRIMARY="${BASE}-${BRANCH_SLUG}-${SHA}"
          fi

          echo "list=$TAGS" >> "$GITHUB_OUTPUT"
          echo "primary=$PRIMARY" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Log In To Registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" \
            -u "$REGISTRY_USER" --password-stdin

      - name: Log In To dhi.io
        env:
          DHI_USER: ${{ secrets.DHI_USER }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          printf '%s' "$DHI_TOKEN" | docker login dhi.io \
            -u "$DHI_USER" --password-stdin

      - name: Build Image
        id: build
        env:
          TAG_LIST_CSV: ${{ steps.tags.outputs.list }}
        run: |
          docker buildx inspect forgejo-builder >/dev/null 2>&1 || \
            docker buildx create --name forgejo-builder --use
          IFS=',' read -ra TAG_LIST <<< "$TAG_LIST_CSV"
          TAG_ARGS=()
          for t in "${TAG_LIST[@]}"; do
            TAG_ARGS+=(--tag "$t")
          done
          docker buildx build \
            --pull \
            --platform linux/amd64 \
            "${TAG_ARGS[@]}" \
            --cache-from "type=registry,ref=${IMAGE}:${TAG_VAR}-cache" \
            --cache-to "type=registry,ref=${IMAGE}:${TAG_VAR}-cache,mode=max" \
            --metadata-file metadata.json \
            --load \
            "$CONTEXT"
          DIGEST=$(jq -r '."containerimage.digest" // empty' metadata.json)
          if [ -z "$DIGEST" ]; then
            echo "Could not determine built image digest from buildx metadata" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Log Out Of dhi.io
        if: always()
        run: docker logout dhi.io

      - name: Get Trivy DB Cache Key Date
        id: trivy-date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy DB
        uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-date.outputs.date }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Generate SBOM
        env:
          PRIMARY_TAG: ${{ steps.tags.outputs.primary }}
        run: |
          trivy image \
            --cache-dir ~/.cache/trivy \
            --format cyclonedx \
            --output sbom.cdx.json \
            "$PRIMARY_TAG"

      - name: Scan Image
        run: |
          trivy sbom \
            --cache-dir ~/.cache/trivy \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --ignorefile "${CONTEXT}/.trivyignore" \
            sbom.cdx.json

      - name: Push Image
        id: push
        env:
          TAG_LIST_CSV: ${{ steps.tags.outputs.list }}
          PRIMARY_TAG: ${{ steps.tags.outputs.primary }}
        run: |
          IFS=',' read -ra TAG_LIST <<< "$TAG_LIST_CSV"
          for t in "${TAG_LIST[@]}"; do
            docker push "$t"
          done
          DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$PRIMARY_TAG" \
            | grep -F "${IMAGE}@" | head -n1 | cut -d'@' -f2)
          if [ -z "$DIGEST" ]; then
            echo "Could not resolve pushed digest for ${IMAGE}" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign And Attest Image
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          IMAGE_REF="${IMAGE}@${PUSHED_DIGEST}"
          cosign sign --key env://COSIGN_KEY --yes "$IMAGE_REF"
          cosign attest --key env://COSIGN_KEY --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "$IMAGE_REF"

      - name: Log Out Of Registry
        if: always()
        run: docker logout "$REGISTRY"

      - name: Notify n8n
        if: '!cancelled()'
        continue-on-error: true
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          APPRISE_URL: ${{ secrets.APPRISE_URL }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          IMAGE_SHA: ${{ steps.tags.outputs.sha }}
          SEMVER: ${{ steps.version.outputs.full }}
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eo pipefail
          curl \
            --fail-with-body \
            --show-error \
            --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Token: ${N8N_WEBHOOK_TOKEN}" \
            -d "{
              \"repository\":\"${REPOSITORY}\",\"workflow\":\"${WORKFLOW}\",\"run_url\":\"${RUN_URL}\",\"status\":\"${JOB_STATUS}\",\"apprise_url\":\"${APPRISE_URL}\"
            }" \
            "$N8N_WEBHOOK_URL"
